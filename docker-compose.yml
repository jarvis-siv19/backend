
services:
  api:
    build: .
    container_name: splitllm-api
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      # Override so the container listens on 8081 (matches the port mapping and
      # local dev convention); Cloud Run sets PORT=8080 in production.
      - PORT=8081
      - MONGODB_URI=mongodb://mongo:27017
    volumes:
      - .:/app
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: splitllm-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
