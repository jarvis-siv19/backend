name: CI

on:
  pull_request:
  push:
    branches: [main]

# Deployment is NOT automated. Production runs on IBM Cloud Code Engine and is
# deployed by running ./ibm/deploy.sh from a machine with `ibmcloud login`.
#
# This workflow used to deploy to Zoho Catalyst AppSail on every push to main.
# Production moved to Code Engine, but the job stayed — so it kept reporting
# success while deploying to a host that serves 404, which made a green CI look
# like the backend had shipped when it had not. Removed rather than left
# misleading. See README "Deployment".

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
